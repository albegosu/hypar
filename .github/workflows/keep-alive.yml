# Calls /api/health once a day. It runs a query, so a Supabase free project
# never reaches the 7 days without activity that pause it.
#
# Set the HYPAR_URL repository variable (not a secret), e.g. https://hypar.vercel.app.
# GitHub disables scheduled workflows after 60 days without commits; re-enable
# it from the Actions tab when that email arrives.
name: Keep alive

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health check
        env:
          HYPAR_URL: ${{ vars.HYPAR_URL }}
        run: |
          if [ -z "$HYPAR_URL" ]; then
            echo "::notice::HYPAR_URL is not set; nothing to ping"
            exit 0
          fi
          body=$(curl -fsS --retry 3 --retry-delay 20 --max-time 60 "${HYPAR_URL%/}/api/health")
          echo "$body"
          echo "$body" | grep -Eq '"db": *true' || { echo "::error::database check failed"; exit 1; }
